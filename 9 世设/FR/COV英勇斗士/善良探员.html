<body><span><strong><span>善良探员Agents 
of Good</SPAN></STRONG></SPAN><br><span>这一章更多是针对DM而不是玩家，因为它描述了DM可能想要整合到现有战役中的几个NPC和怪物。这里呈现的NPC和怪物被设计成英勇英雄的盟友、同伴、坐骑和动物伙伴。DM还可以将这些角色和生物的名字归档，并使用它们的统计数据来代表战役中的其他角色和生物。</SPAN> 
</BODY></HTML>
