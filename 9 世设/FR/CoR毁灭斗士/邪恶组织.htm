<p><b><span>邪恶组织</span></b></p>

<p><span>邪恶往往以随机的方式被体验，就像文明社会的裂缝中生长的野草。然而，在某些地方，邪恶被精心培育、滋养，并能够造成巨大的伤害。邪恶组织经常在寻找新成员：他们可以腐蚀的无辜者，或者能进一步实现他们目标的强大角色。</span></p>
