        <h1>龙巢</h1>
        <p>甚至比龙的自我保护意识更强烈的，是其聚敛财富的内在需要，就像许多有勇无谋的冒险者所得知的那样，龙愿意采取极端措施保护这些珍贵的宝库。为了保护它们的贵重物品，龙在它们的巢穴里制造出精密的防护措施-从致命的陷阱到警惕的仆从的所有东西。本章详细描述了各种与龙有关的挑战，包括新的陷阱和危险，以及一些经常被用作巢穴守卫的与龙有关的新型生物。</p>
