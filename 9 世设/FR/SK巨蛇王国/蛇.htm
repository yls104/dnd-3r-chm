<p><b><span>蛇<span>Snake</span></span></b></p>

<p><span>巨蛇王国是各种各样的蛇的家园，其中一些很少见。</span></p>

<p><b><span>技能<span>:</span></span></b><span>蛇有<span>+4</span>种族加值在躲藏、聆听和侦查检定上，<span>+8</span>种族加值在平衡和攀爬检定上。</span></p>

<p><span>蛇总是可以选择在攀爬检定中取<span>10</span>，即使是匆忙中或受到威胁。</span></p>

<p><span>蛇在攀爬检定中使用力量修正值或敏捷修正值，以较高者为准</span></p>
