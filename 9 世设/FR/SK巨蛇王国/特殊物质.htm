<p><b><span>特殊物质</span></b></p>

<p><span>以下特殊物质受到世界各地有鳞者的珍视。它可以由拥有工艺（炼金术）技能的角色制造。</span></p>

<p><b><span>血花药膏<span>Bloodflower Salve</span>：</span></b><span>血花是一种具有魔法属性的红色叶子的野花。曾广泛生长在曾作为战场的开阔平原上，但现在只有在楚尔特丛林和姆海尔丛林<span>Mhair Jungles</span>的深处才能找到。</span></p>

<p><span>血花药膏必须在受到伤害之前涂抹在身体上。此后，当任何人在<span>25</span>英尺内说出指定在制作药膏时使用的命令词时，它就会发挥治疗微伤法术的效果。血花药膏在说出命令词之前保持活跃，或者直到用至少一夸脱的液体洗掉为止。</span></p>

<p><b><span>物品 成本 重量 工艺（炼金术）<span>DC </span></span></b></p>
