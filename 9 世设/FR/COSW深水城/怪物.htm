<p><b><span>怪物<span>Monsters</span></span></b></p>

<p><span>璀璨之城是大量怪物的家园。这些生物通常分为三种<span>:</span>一种是公开生活在深水镇居民中间的，一种是像鸡舍里的狐狸一样捕食居民的，还有一种是在璀璨之城里扮演寄生角色的。大多数深水城的<span>“</span>怪物<span>”</span>都是独来独往的，至少对他们自己的同类来说是这样，但那些在阴影中协同工作的人往往在城市中发挥着巨大的隐性影响。</span></p>
