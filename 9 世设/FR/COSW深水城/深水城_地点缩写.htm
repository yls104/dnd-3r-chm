<p><b><span>地点缩写</span></b></p>

<p><b><span>地点</span></b></p>

<p><span>在这本书中，你会看到对特定建筑物或地点的参考，后面跟着一个标签，如<span>(C63)</span>或<span>(UM5)</span>或<span>($44)</span>。这些都是指在第<span>4</span>章中详细描述整个城市的一系列地图上出现的地图标签。以下是缩略词及其含义的摘要。</span></p>

<p><span>C </span><span>城堡区</span></p>

<p><span>CD </span><span>死者之城</span></p>

<p><span>H </span><span>深水港</span></p>

<p><span>D </span><span>码头区</span></p>

<p><span>N </span><span>北区</span></p>

<p><span>$ </span><span>海滨区</span></p>

<p><span>S </span><span>南区</span></p>

<p><span>T </span><span>贸易区</span></p>

<p><span>SK </span><span>颅骨港</span></p>

<p><span>UM </span><span>地脉迷城</span></p>
