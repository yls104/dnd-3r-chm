<div class="wrap">
    <h1>宗教</h1>
    
    <p>
        安黛尔的多数居民遵从<strong>银焰教会</strong>的领导或是信奉<strong>天命诸神</strong>，尤其偏好<strong>阿拉瓦依</strong>，<strong>奥林</strong>和<strong>欧拉卓</strong>。偶尔其他教会组织能在费尔海文寻求到足够民众支持，然后在该城建立教堂。
    </p>
