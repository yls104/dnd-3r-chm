    <h1>龙纹家族</h1>
    <p>十三个龙纹家族垄断着科瓦雷的经济和工业。龙纹家庭的直系血统通常可以凭借经济实力，在上流社会有着稳固的地位。家族的权贵及其党羽统治着整个大陆的高层，包括王室成员以及高层神职人员都在他们的掌控范围内，而血统比较淡薄的后代也在贵族阶层许可的范围内尽可能获利，处在社会中间地位。</p>
