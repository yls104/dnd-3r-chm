<h1>冒险话题</h1>
<hr>
<p>—冒险者手中的某张藏宝图将旅行目标直指高拉卓大裂谷深处失落多年的城市，据说城市历史可以追溯到恶魔年代。而得知此讯息的砂主成员不惜一切代价地想要拿到这份藏宝图。</p>

<p>—昆达拉克的金库素有固若金汤的美名。而冒险者受到雇佣，前往寻找一件终末战争前便保存在金库中的神器。一旦冒险者成功，无论是银焰教会的高阶牧师还是黑暗梦境成员，都会以各种善良或邪恶的理由声名自己对这件物品的所有权。</p>
