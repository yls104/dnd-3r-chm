<h1>产业</h1>
<hr>
<p>铁根山脉中蕴藏着全科瓦雷储量最丰富的矿物，摩洛领因此成为科瓦雷最主要的铜，铁及其他战备金属的产地。过去数个世纪中，矮人们还逐渐发掘出黄金，白金以及各种稀有金属。昆达拉克家族将矮人的财富和他们龙纹的力量联合起来，逐渐成为科瓦雷最重要的银行家，并且掌握改领域中最多数量的金库。其他氏族也纷纷使用财力扩大自己的影响，他们扮演金融家和投资者的角色。少数氏族依靠打铁和铸造闯荡出名声，但至今工艺水准仍比不了布鲁兰制品的强度或精灵产物的艺术感。</p>
