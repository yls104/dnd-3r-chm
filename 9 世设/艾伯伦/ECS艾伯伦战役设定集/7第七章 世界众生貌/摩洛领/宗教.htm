<h1>宗教</h1>
<hr>
<p>过去千年中，天命诸神在摩洛领中逐渐占据重要地位。世界和财富的主人寇·柯兰在矮人中拥有大量信徒，博得雷，欧拉卓，昂那塔和杜·顿恩也广泛受到崇拜。</p>

<p>居住在摩洛领中的乔拉拾塔兽人从来不遵从西部兽人组织护门者的教条。他们的信仰多种多样，有些敬拜嘲弄，有些则投身于黄泉巨龙会。而多数兽人是不可知论者，声称没有任何神明可以赋予矮人掌控摩洛领的权力。</p>
