<p>摩洛领是探险和策划阴谋的好地方。在钢铁议会表面的和谐下，各个氏族陈年的积怨仍然在暗中滋长，冒险者很有可能卷入矮人之间的秘密战争或是金权会的阴谋中。铁根山脉地区原始而荒凉，经由商路抵达此处的旅者很可能面临巨魔，兽人或是其他怪物的威胁，而寒冷的气候及不稳固的山体并不比怪兽更令人放心。</p>
