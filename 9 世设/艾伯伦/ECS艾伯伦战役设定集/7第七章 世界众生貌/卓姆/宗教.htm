<h1>宗教</h1>
<hr>
<p>卓姆没有国家性的宗教信仰。信奉嘲弄和阴影的牧师可以在很多聚落中找到，并且这里还有少数教派尊崇黄泉巨龙会。</p>

<p>虽然卓姆居民很少在宗教事务方面耗费心思，但对银焰教会的仇恨却是几乎所有居民的普遍情绪。携带银焰标志的旅行者在这里无论遇到何种生物，都会毫无悬念地受到敌对待遇。</p>
