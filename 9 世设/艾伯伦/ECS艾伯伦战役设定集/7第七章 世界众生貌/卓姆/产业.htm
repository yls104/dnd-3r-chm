<h1>产业</h1>
<hr>
<p>卓姆地区几乎不存在有组织的工业，本地最强大的资源便是居民种族天生的体格优势。过去五年内，三个鬼婆与西部科瓦雷国家曾多次接触，特别是吉拉哥，安黛尔和布鲁兰（虽然卓姆和布鲁兰边境摩擦不断）。由于卓姆统治者的大力推销，目前食人魔劳工和牛头人保镖在布鲁兰与吉拉哥城市里并不少见。瑟雷恩则拒绝接受任何怪物种族的佣兵或劳动力，同时各地银焰教会的信徒对现状感到相当困扰。</p>

<p>除去这些活物资源，卓姆还拥有可观的矿藏。龙晶矿脉（特别是艾伯伦龙晶）在卓姆纵横分部，北部山区还蕴藏着稀有的拜拾克矿石。从前这里因为危险很难做勘探工作，但是最近萨拉释克家族已经取得在怪物王国境内开采矿物的许可。</p>
