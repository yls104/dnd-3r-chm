<hr>
<p>穿梭于拉扎尔邦联各港口和村庄中间是刺激而危险的行为。拉扎尔没有法律保障，生存条件严苛但充满各种机遇。各个领国的概念相比五国则完全不同，每个公子都用最强硬的铁腕管理自己手下，而失败者会被更强大更狡诈的个体取代。从船长到酒吧服务生，拉扎尔邦联内每个人都尽可能地为自己牟取利益。冒险者在这里有各种可能树敌（或结交朋友），离散或者干脆失踪。在拉扎尔邦联内旅行要时刻紧张神经，并且把武器放在最顺手的地方。</p>
