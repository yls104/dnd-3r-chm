<h1>恶魔荒原 - 政治</h1>
<hr>
<p>咯里恩部落崇拜荒原上邪恶的存在。混有邪兽鬼血统的半恶魔统治着大多数分支部落，其他部落则由被恶魔附身的牧师或战士统治。部落的统治权很不稳固，任何足够强大的战士都可以挑战目前的酋长，以取悦恶魔获得领导权。整个部落中充斥着无尽的争斗，暴力和流血是每个人的日常生活。</p>

<p>对于加什卡拉部落来说，祭司阶层决定其中每个氏族的领导人。通常氏族酋长会执行统治直到去世，但是祭司阶层有随时更换新领导的权力。每个氏族负责保卫迷峰群谷中的一小片区域，整个部落每年聚会四次。他们在聚会中举行宗教仪式，交流战斗技巧，并且分享分享彼此的意见和所知信息。</p>
