<div class="page-container">
    <h1 class="main-title">宗教</h1>
    
    <p>
        布鲁兰的多数居民遵从<strong>银焰教会</strong>的领导或是信奉天命诸神，但整个国家整体对宗教并不热心。国民更愿意相信自己或者崇拜他们的国王，对从未降临过凡间的诸神无甚兴趣。萨恩地区的四海一家的理念也逐渐发展到近乎信仰，在这个大都市中你可以找到任何信仰或教派的追随者。其中某些只是偶然经过的旅者，也有部分留在萨恩（虽然机会成熟的时候他们也想离开）想要改变都市思潮混乱的现状，维持神性的存在。
    </p>

    <p>
        少数有暴力倾向的危险教派也在布鲁兰境内藏匿。<strong>沃尔之血</strong>在萨恩城里就建立有隐秘的神庙。<strong>黄泉巨龙会</strong>的某些组织也长期以来掌握着国家部分权力，虽然他们很少表现自己的真实身份或真实意图。
    </p>
