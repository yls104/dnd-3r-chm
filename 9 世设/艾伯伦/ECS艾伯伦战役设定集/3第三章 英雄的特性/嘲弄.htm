    <p>嘲弄是中立邪恶阵营，视叛逆为荣誉，并最终背叛兄弟杜·顿恩和姐姐杜·哈拉，因此受到天命诸神的强烈指责，并最终遭到放逐。嘲弄是训练有素的战士，信徒包括战士，游荡者，武僧和刺客。嘲弄的通常形象是食尸鬼外形的人类武士，皮肤由于撕裂而脱落，常常穿着敌人的外皮，有时被描绘成半炼狱红龙。嘲弄相关领域是毁灭，邪恶，诡术和战争，偏好武器是单镰。</p>
