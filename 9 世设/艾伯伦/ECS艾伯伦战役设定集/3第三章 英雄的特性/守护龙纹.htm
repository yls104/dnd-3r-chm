<div class="container">
    <h1 class="main-title">守护龙纹</h1>
    <p style="font-weight:bold;text-align:center;margin-top:-10px;letter-spacing:2px;">MARK OF SENTINEL</p>
    
    <p>拥有守护龙纹的角色擅长保护目标。</p>
    <p><b>家族：</b>由人类组成的邓奈斯家族拥有守护龙纹，通过防卫行会为统治阶层提供保镖。家族同时包括部分在边界地区拥有相当权限的精英雇佣军官。邓奈斯家族起源坎纳斯，防卫行会势力遍及科瓦雷。邓奈斯家族的非龙纹成员通常担当不依靠魔法力量的保镖。</p>
    
    <p><b>龙纹：</b>守护龙纹拥有以下能力。</p>
    <p style="text-indent:2em;"><b>低级龙纹：</b>角色可以每日 1 次施展法师护甲，防护箭矢，虔诚护盾或护卫他人。角色在察言观色检定中获得 + 2 加值。</p>
    <p style="text-indent:2em;"><b>次级龙纹：</b>角色可以每日 1 次施展防护能量伤害或法术无效结界。</p>
    <p style="text-indent:2em;"><b>高级龙纹：</b>角色可以每日 1 次施展法术无效结界。</p>
