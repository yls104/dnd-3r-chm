    <p>寇·柯兰是绝对中立阵营，掌管交易和金钱，信徒包括商界领袖，贸易商和盗贼，以及任何想要继续发财的群体。寇·柯兰的通常形象是穿着华丽，体态丰盈且面貌可亲的人类或矮人。部分古书中把他描绘成卧在冰蓝宝石床上的白龙。寇·柯兰是欧拉卓和昂那塔的儿子，同时也是监守的双胞胎兄弟。寇·柯兰相关领域是魅惑，商业和旅行，偏好武器是硬头锤。</p>
