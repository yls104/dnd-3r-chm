    <h1 class="main-title">天命诸神</h1>
    <p style="font-weight:bold;text-align:center;margin-top:-10px;letter-spacing:2px;">THE SOVEREIGN HOST</p>
    
    <p>天命诸神是科瓦雷最常见的信仰。大多数民众崇拜整个天命诸神，在不同的情况下会向不同的神祈祷。就连很多牧师也是侍奉整个天命诸神而不是特定神祇（参阅第35页，信仰神系）。作为一个整体的天命诸神是中立善良阵营，偏好武器是长剑——象征着天命诸神中的勇者杜·顿恩。</p>
