    <p>监守属于中立邪恶阵营，掌管死亡和衰败，同时也是寇·柯兰的双胞胎兄弟。寇·柯兰代表对物质财富的追求，而监守代表对死者灵魂的饥渴和贪婪。监守通常潜伏在黑暗里，等待摄取漫游经过死者国度杜尔鲁的灵魂。他的通常形象是位憔悴的或是极度肥满的人类，巫妖，或食尸鬼，有时被描绘成骷髅龙。监守所属领域包括死亡，腐朽和邪恶，偏好武器是巨镰。</p>
