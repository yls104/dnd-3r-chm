    <p>欧拉卓是中立善良阵营，掌管幸运和丰饶，信徒包括赌徒，游荡者，吟游诗人以及其他享乐主义者。欧拉卓的通常形象是年轻的半身人，有时被描绘成老年人类，偶尔以黑龙的形象出现。欧拉卓是昂那塔的妻子，同时也是寇·柯兰与监守的母亲。欧拉卓相关领域是筵席，善良，医疗和幸运，偏好武器是镰刀。</p>
