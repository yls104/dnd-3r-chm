<div class="container">
    <h1 class="main-title">使用潜能点</h1>

    <p>引入潜能点可能会需要玩家改变游戏习惯。例如：许多玩家喜欢在掷攻击的同时掷伤害。而在使用潜能点的游戏中，玩家不应该这么做；他们必须在确定能造成多少伤害之前决定是否使用潜能点。</p>

    <p>同理，当与有隐蔽的敌人战斗时，玩家应该先掷攻击，再决定是否使用潜能点，接下来才掷失手率。</p>

    <p>也就是说，默认规则下玩家必须在确定一个 d 2 0 检定是否成功之前决定是否使用潜能点。</p>
