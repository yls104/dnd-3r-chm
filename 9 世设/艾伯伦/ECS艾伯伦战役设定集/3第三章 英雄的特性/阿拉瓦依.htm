    <p style="font-weight:bold;text-align:center;margin-top:-10px;letter-spacing:2px;">Arawai</p>
    
    <p>阿拉瓦依是中立善良阵营，掌管富饶，丰收和植物。信徒除德鲁伊和巡林客还包括农民，士兵以及其他关心天气和收成的群体。阿拉瓦依的通常形象是半精灵女子，有时被描绘成半身人或者人类，偶尔以青铜龙形象出现。阿拉瓦依是巴力诺及饥渴的妹妹，同时也是愤恨的母亲（根据经书的记载，愤恨是阿拉瓦依惨遭兄长强暴的结果）。阿拉瓦依的相关领域是善良，生命，植物和天气，偏好武器是钉头锤。</p>
