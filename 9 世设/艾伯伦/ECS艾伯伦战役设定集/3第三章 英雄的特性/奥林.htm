    <p>奥林是守序中立阵营，掌管知识和魔法。信徒包括多数奥术施法者，贤者，图书馆员以及抄录员。奥林在古书中的通常形象是人类或侏儒法师，偶尔被描绘成威严的蓝龙。奥林是昂那塔的哥哥，博得雷的丈夫，并且和阴影关系密切。奥林的相关领域是知识，秩序和魔法，偏好武器是木棍。</p>
