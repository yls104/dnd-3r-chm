    <p>昂那塔是中立善良阵营，掌管手艺，工业和火焰，信徒包括工匠，艺术家，铁匠，熔炼工，以及许多制造业者。矮人偏好信仰昂那塔，他在古书中的通常形象是矮人铁匠，偶尔被描绘成黄铜龙。偏好火焰的法师和心灵术士有时会信仰昂那塔。昂那塔是欧拉卓的丈夫，同时也是寇·柯兰与监守的父亲，相关领域是工匠，火和善良，偏好武器是战锤。</p>
