    <p>杜·哈拉是中立善良阵营，光荣战斗，自我牺牲和阳光的守护神。杜·哈拉是和平使者，谨慎谋略家和战略家，信徒包括圣武士，将军以及唇枪舌剑的外交家。杜·哈拉同时也是太阳神，为世界最阴暗的角落带来光明。杜·哈拉的通常形象是闪耀着神圣光辉的人类或半精灵骑士，有时被描绘成栖息在云端的红龙。杜·哈拉是杜·顿恩和嘲弄的姐姐，相关领域是善良，秩序，太阳和战争，偏好武器是战戟。</p>
