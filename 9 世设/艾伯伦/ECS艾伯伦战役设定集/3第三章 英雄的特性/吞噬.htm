    <p style="font-weight:bold;text-align:center;margin-top:-10px;letter-spacing:2px;">The Devourer</p>
    
    <p>吞噬是中立邪恶阵营，也是阿拉瓦依和巴力诺的哥哥。传说他在强暴妹妹阿拉瓦依后得到女儿愤恨。作为深海之主，吞噬掌管漩涡和暗礁，尽情展现着大自然的破坏力，信徒包括沙华鱼人，而水手们也通常会因为恐惧而努力满足他的要求。吞噬的通常形象是头发和胡须中长满海草的人类或鱼身怪物，沙华鱼人，凶恶的鲨鱼或是龙龟。吞噬相关领域是毁灭，邪恶，水和天气，偏好武器是三叉戟。</p>
