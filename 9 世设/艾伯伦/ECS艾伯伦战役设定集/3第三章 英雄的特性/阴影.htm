    <p>奥林某次法术试验使自己的影子产生独立人格，阴影就此诞生。阴影是混乱邪恶阵营，致力黑暗魔法的研究以及侵蚀自然。信徒包括邪恶的法师，术士，以及许多居住在卓姆的怪物。阴影的通常形象是幽影，有时（特别是在卓姆）被描绘成影龙。阴影相关领域是混乱，邪恶，魔法和阴影，偏好武器是木棍。</p>
