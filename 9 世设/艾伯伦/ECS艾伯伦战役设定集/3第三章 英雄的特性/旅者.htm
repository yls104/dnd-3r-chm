    <p>旅者是混乱中立阵营，和其他任何神祇毫无关系，在黑暗六邪神中最为神秘。据说由于同情变形生物，旅者使用千种伪装在世界旅行。旅者诡计多端，偏好谨慎而周密的阴谋。部分地区称旅者为礼物赐予者，但谚语警告大家“当心旅者的礼物”。旅者的信徒包括变形怪，兽化人，以及许多半变形怪和半兽化人。旅者相关领域是工匠，混乱，旅行和诡术，偏好武器是弯刀。</p>
