    <h1 class="main-title">制造西伯瑞斯龙晶物品</h1>
    <h2 class="sub-title">CRAFTING SIBERYS SHARD ITEMS</h2>

    <p>制造包含西伯瑞斯龙晶的魔法物品通常与制造其他类似魔法物品相仿。自然，龙晶必须是原料中的组成部分，而且在制作法器前通常需要调整到针对特定龙纹的状态。</p>
