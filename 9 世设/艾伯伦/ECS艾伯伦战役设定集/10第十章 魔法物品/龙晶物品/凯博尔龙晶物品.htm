    <h1 class="main-title">凯博尔龙晶物品</h1>
    
    <p>
        凯博尔龙晶镶嵌在地底深处火山洞的岩壁，通常接近熔岩湖或是硫磺坑。虽然艾伯伦各地都蕴藏有凯博尔龙晶，但在魔物和元素的活动频繁的地区最为集中，例如<span class="highlight">恶魔荒原</span>。这种昏暗的晶体内部纹路有些像夜空般湛蓝，有些则呈油黑色。
    </p>
    
    <p>
        凯博尔龙晶的魔法特性与<span class="highlight">禁锢</span>相关。因此，制造元素束缚物品需要把元素禁锢在凯博尔龙晶内，而这种晶体也经常用来充当禁锢法阵，<span class="highlight">锢魂术</span>，或其他类似法术的施法材料。凯博尔龙晶也被叫做<span class="highlight">夜晶</span>或<span class="highlight">恶魔石</span>。
    </p>
