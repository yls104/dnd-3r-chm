<body><!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>新德鲁伊（护门者）法术</title>
<style>
    /* 全局样式 */
    body {
        font-family: "Georgia", "Times New Roman", "SimSun", serif;
        background-color: #2e3b2f; /* 深森林绿背景 */
        color: #2c2c2c;
        margin: 0;
        padding: 40px 20px;
        
        
        line-height: 1.6;
    }

    /* 卷轴/纸张容器 */
    .scroll-container {
        background-color: #fdfbf7; /* 羊皮纸色 */
        width: 100%;
        max-width: 800px;
        padding: 50px 60px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        border-radius: 4px;
        position: relative;
        background-image: linear-gradient(to right, rgba(0,0,0,0.02) 1px, transparent 1px),
                          linear-gradient(to bottom, rgba(0,0,0,0.02) 1px, transparent 1px);
        background-size: 20px 20px; /* 模拟纸张纹理 */
    }

    /* 标题样式 */
    h1 {
        text-align: center;
        color: #1a2f1c;
        font-size: 2.2em;
        margin-bottom: 20px;
        border-bottom: 2px solid #4a6fa5;
        padding-bottom: 15px;
        letter-spacing: 1px;
    }

    /* 描述文本 */
    .intro-text {
        font-style: italic;
        color: #555;
        margin-bottom: 40px;
        text-align: justify;
        font-size: 1.1em;
    }

    /* 法术条目样式 */
    .spell-entry {
        margin-bottom: 30px;
        padding-left: 20px;
        border-left: 4px solid #5d7a5f; /* 左侧装饰线 */
    }

    /* 环位标题 */
    .spell-level {
        font-size: 1.4em;
        font-weight: bold;
        color: #8b3a3a; /* 深红色强调 */
        margin-bottom: 5px;
        display: block;
    }

    /* 法术名称 */
    .spell-name {
        font-weight: bold;
        font-size: 1.2em;
        color: #2c3e50;
    }

    /* 法术描述 */
    .spell-desc {
        margin-top: 5px;
        color: #333;
    }

    /* 星号注释（可选） */
    .asterisk {
        color: #8b3a3a;
        font-weight: bold;
    }

    /* 响应式调整 */
    @media (max-width: 600px) {
        .scroll-container {
            padding: 30px 20px;
        }
        h1 {
            font-size: 1.8em;
        }
    }
</style>
</head>
<body>

<div class="scroll-container">
    <h1>新德鲁伊（护门者）法术</h1>
    
    <p class="intro-text">
        以下新法术是为历史悠久的护门者德鲁伊准备的。拥有护门者专长的德鲁伊，或是护门者教派的巡林客能将以下法术加入法术列表。
    </p>

    <!-- 1环法术 -->
    <div class="spell-entry">
        <span class="spell-level">1 环</span>
        <div class="spell-content">
            <span class="spell-name">侦测异怪<span class="asterisk">*</span>：</span>
            <span class="spell-desc">侦测 60 尺内的异怪。</span>
        </div>
    </div>

    <!-- 2环法术 -->
    <div class="spell-entry">
        <span class="spell-level">2 环</span>
        <div class="spell-content">
            <span class="spell-name">自然纯净法域<span class="asterisk">*</span>：</span>
            <span class="spell-desc">弱化区域内的异怪，强化区域内的植物和精类生物。</span>
        </div>
    </div>

    <!-- 4环法术 -->
    <div class="spell-entry">
        <span class="spell-level">4 环</span>
        <div class="spell-content">
            <span class="spell-name">自然之怒<span class="asterisk">*</span>：</span>
            <span class="spell-desc">异怪晕眩并受到伤害，其他生物受到伤害。</span>
        </div>
    </div>

    <!-- 7环法术 -->
    <div class="spell-entry">
        <span class="spell-level">7 环</span>
        <div class="spell-content">
            <span class="spell-name">回归自然<span class="asterisk">*</span>：</span>
            <span class="spell-desc">降低目标的智力和魔法能力。</span>
        </div>
    </div>

</div>

</body>
