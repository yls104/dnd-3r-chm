<html lang="zh-CN">
<head>

<title>牧师领域 (CLERIC DOMAINS)</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
        font-family: "Georgia", "Times New Roman", serif; /* 使用衬线字体增加宗教典籍感 */
        background: #f7f5f2; /* 仿旧纸张背景色 */
        color: #333; 
        padding: 40px 20px; 
        line-height: 1.8; 
    }
    .wrap { 
        max-width: 760px; 
        margin: 0 auto; 
        background: #fff; 
        padding: 50px 60px; 
        box-shadow: 0 4px 15px rgba(0,0,0,.08); 
        border-top: 5px solid #8e44ad; /* 紫色顶部装饰呼应牧师/神性主题 */
    }
    h1 { 
        font-size: 32px; 
        color: #5d3a6b; /* 深紫色标题 */
        text-align: center; 
        margin-bottom: 40px; 
        letter-spacing: 2px;
        border-bottom: 1px solid #ddd;
        padding-bottom: 20px;
    }
    .domain-block {
        margin-bottom: 30px;
        padding-left: 20px;
        border-left: 4px solid #e0dcd5; /* 左侧装饰线 */
    }
    h2 {
        font-size: 24px;
        color: #2c3e50;
        margin-bottom: 10px;
    }
    p {
        font-size: 18px;
        color: #555;
        margin-bottom: 0;
    }
    strong {
        color: #8e44ad; /* 强调文字颜色 */
        font-weight: bold;
    }
    
    /* 响应式调整 */
    @media (max-width: 600px) {
        .wrap { padding: 30px 20px; }
        h1 { font-size: 26px; }
        h2 { font-size: 20px; }
    }
</style>
</head>
<body>

<div class="wrap">
    <h1>牧师领域</h1>

    <!-- 气领域 -->
    <div class="domain-block">
        <h2>气领域</h2>
        <p><strong>神祇：</strong>巴力诺。</p>
    </div>

    <!-- 动物领域 -->
    <div class="domain-block">
        <h2>动物领域</h2>
        <p><strong>神祇：</strong>巴力诺。</p>
    </div>

</div>

</body>
