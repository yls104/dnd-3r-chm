    <h1 class="main-title">非玩家职业 (NPC CLASSES)</h1>
    <p>玩家角色是卓越的，在艾伯伦世界，多数住民没法像玩家角色那样进展神速；他们欠缺成为英雄的潜力。尤其是对魔法而言，法师需要天赋的能力以及卓越的纪律和意志。普通百姓花费三十年时间阅读法术书，可能仍没法成为哪怕是1级的法师。然而，魔法仍然是世界的组成部分。除标准非玩家职业，例如武者，望族，平民以及专家外，艾伯伦世界还包含两种额外非玩家角色：经过调整的导师，以及新职业魔匠师。</p>
