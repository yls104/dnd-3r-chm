<h1 class="title">环境危害 (Environmental Hazards)</h1>
<p>人物横越炙热的沙漠，会面临炎热与脱水的威胁。潜入极深的水底，可能会溺毙或受到减压伤害。冒险者无时无刻处在危险的环境中。怪物或坏蛋或许无法杀死这些冒险者，但险恶的自然环境却可能足令他们丧命。有些危险只限于某种特殊环境（例如：在寒冷的高山上几乎不可能因酷暑而受伤），但某些危险则可能发生在任何环境（如：强酸和饥渴）。只会在某种特殊地形面临的危险（例如：只会发生在高山上的雪崩），请参见第三章说明。以下叙述在各种环境都可能会出现的危害。</p>
