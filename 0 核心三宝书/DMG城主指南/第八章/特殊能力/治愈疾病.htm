<h1 class="title">治愈疾病</h1>
<p>“医疗”技能可以协助病患康复，当患者进行对抗疾病效果检定时，医疗者也须进行检定。若医疗者的掷骰结果比患者检定结果高，可改采医疗者的掷骰结果作为检定结果。当然，此时患者必须在医疗者的照顾之下，并需要已经进行了8小时休养。</p>
<p>人物每日每项属性可回复1点，即使在病中亦同。因此，若人物十分幸运地只染上小疾，很可能不必计算伤害。</p>
