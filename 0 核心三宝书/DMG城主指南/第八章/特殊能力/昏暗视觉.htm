<h1 class="title">昏暗视觉（Low-Light Vision）</h1>

<p>具有昏暗视觉能力的人物对光十分敏感，因此可在昏暗照明下看到正常视力范围的两倍。若黑暗中的冒险者持着光亮照明范围半径为20英尺的火把，队伍中的精灵可看见40英尺内的事物。昏暗视觉是彩色视觉。只要有烛火般微弱的光源，具有昏暗视觉能力的施法者依然能够阅读卷轴。</p>

<p>身处户外时，若人物具有昏暗视觉，有月光的夜晚就跟白天一样清楚。</p>
