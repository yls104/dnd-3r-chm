<h1 class="title">颤动感知（Tremorsense）</h1>

<p>具有颤动感知能力的生物可凭借地面震动的感觉，感应到特定范围内，任何接触到地面的事物（如土怪的感觉范围为60英尺）。</p>

<p>若感应者和目标间没有直线相连的路径，则感应距离必须以实际路径长度计算。感应者必须与地面保持接触，而且目标生物必须正在活动。只要目标生物进行身体活动，包括施展具姿势成分的法术，即可被感应，即使不是正在移动亦可。</p>
