<p>翼龙、梅杜莎等生物对自身的毒免疫。非生命的生物（构装生物和不死生物）与其他无须进行新陈代谢的生物（如：元素生物）对所有毒都免疫。泥形怪物、植物与其他某些异界生物（如：塔那里魔族）对毒也免疫，但某些特调的毒物可以伤害他们。</p>
