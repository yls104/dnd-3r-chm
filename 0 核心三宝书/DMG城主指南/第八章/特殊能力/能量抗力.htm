<h1 class="title">能量抗力（Resistance to Energy）</h1>

<p>能量抗力通常属于特异能力，具有此能力的生物每轮都可能免除一部分特定形式的伤害（如寒冷、电击或火焰等），但并非对该类攻击完全免疫。</p>

<p>生物特性中会标示出能量抗力种类与数值。例如：小巨灵具有抗火10，表示小巨灵每一轮能免除10点火焰伤害，不论魔法火焰或一般火焰。</p>

<p>若生物的能量抗力可完全免除能量攻击所造成的伤害，该次攻击便无法干扰该生物施法。</p>

<p>此种能量抗力无法与法术提供的抗力累加（如“抵抗元素伤害”）。</p>
