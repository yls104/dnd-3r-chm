<h1 class="title">快速医疗（Fast Healing）</h1>
<p>某些生物具有能够迅速回复生命值的特异能力。除本节的特别注明之外，快速医疗与自然医疗完全相同（见《玩家手册》147页）。</p>
<p>具有此能力的生物，在其回合开始时可获得固定点数的生命值（在该生物的描述中会注明）。</p>
<p>快速医疗能力无法使生物重新长出或重新接合被截断的肢体，这与再生能力不同（见298页）。</p>
<p>具有快速医疗能力的生物同时受到非致命伤害与致命伤害时，会先医疗非致命伤害。</p>
<p>快速医疗无法回复生物因饥饿、干渴或窒息而损失的生命值。</p>
<p>快速医疗无法增加该生物因变形而增加的生命值。</p>
