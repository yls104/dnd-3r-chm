<h1 class="title">驱散抗力（Turn Resistance）</h1>

<p>有些生物（通常为不死生物）具有强大意志力或邪恶力量，不易被牧师或圣武士影响（见《玩家手册》160页有关驱散与斥喝不死生物相关说明）。驱散抗力是一种特异能力。</p>

<p>进行驱散、斥喝、命令或鼓舞不死生物时，将该生物的生命骰加上此加值。例如：若要驱散、斥喝、命令或鼓舞HD为3且驱散抗力为+2的幽魂，应将他视为具有5HD的生物，但他在其他时候仍是3HD的生物。</p>
