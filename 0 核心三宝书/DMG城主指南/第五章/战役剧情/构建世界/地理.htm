<h1 class="title">地理</h1>
<p>战役需要有背景世界，而世界设计一定牵涉到地理。换言之，想要创造世界，你就要设法安置山脉、海洋、河流、城镇、秘密要塞、恐怖森林，以及其他各种各样的地形地貌。</p>
<p>如果你想要模拟真实世界的地理环境，可以多阅读百科全书及各种地图集，以了解现实地形、气候、自然与人文地理的规律。你研究得愈多，愈能使玩家信服。如果你只是要创造一个奇幻世界，则只要了解基本地理常识即可，除非你的玩家喜欢吹毛求疵。一般而言，你只需要稍微知道地形对气候的影响、不同地形间的相互作用（例如靠海的山脉走向多与海岸线平行），以及气候与地形对居住的影响就够了。</p>
<p>设想好之后，就可以开始绘制世界地图或区域地图。</p>
