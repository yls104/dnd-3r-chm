<h1 class="title">经济</h1>
<p>虽然对玩家人物来说财宝才是最重要的，但你也应该对围绕他们挣到的财宝、他们购买的装备、他们享受的服务等等的经济学有个基本的概念。经济体系不需太复杂，但必须一致。如果在索雷斯一把长剑通常卖20金币，就不太可能突然涨到200金币，除非有特别原因，例如：金属、矿石的来源突然被切断，百英里里的铁匠都突然死于非命或发生其他怪事。</p>
