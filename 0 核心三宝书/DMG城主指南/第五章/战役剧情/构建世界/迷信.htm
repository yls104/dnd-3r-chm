<h1 class="title">迷信</h1>
<p>虽然魔法存在并广为人知，但这不代表一般人都了解魔法是怎么运作、何时运作的。类似魔法的仪式，但却不会造成魔法效果的迷信行为是很常见的。为给你的世界添加一些细节，以反映社会的关注、禁忌或是潜藏的恐惧，你可发明一些迷信行为（或参考真实世界的案例），下列是一些常例：</p>
<ul>
<li>普通人相信某些商人贩卖的某些护身符或装饰品能带来好运，虽然实际上他们并没有魔法效果。比如现实世界里的兔子脚。</li>
<li>在某些文化中，人民会迷信一些手势或话语，例如对打喷嚏的人说：“祝你心想事成！”</li>
<li>某些人宣称可从飞鸟的移动中看见预兆。究竟他只是说出迷信的人们想听的话或真的具有某种魔法能力？</li>
</ul>
