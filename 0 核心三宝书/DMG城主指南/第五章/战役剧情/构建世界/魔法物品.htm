<h1 class="title">魔法物品</h1>
<p>本书第七章的魔法物品都列有价格。虽然他们稀有，但就和其他商品一样在市场上买卖流通。魔法物品的价格超出了绝大部分人之可及，只有富人或中高等级的玩家人物，才有能力买卖甚至向施法者订制魔法物品。大城市中有些店铺会专营魔法物品，如果他们有一大群冒险者或者富人顾客的话。这样的店铺也会布置大量的魔法保护以防范游荡者。在一般商店或市场偶尔也可见到魔法物品，例如铁匠可能同时贩卖魔法武器与一般武器。</p>
