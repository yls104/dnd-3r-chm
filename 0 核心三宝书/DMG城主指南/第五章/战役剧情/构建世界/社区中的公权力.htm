<h1 class="title">社区中的公权力</h1>
<p>维持社区公权力的人不一定是掌权者本身，可能是一些既有的执法人员或组织。</p>
<p>治安官 / 守卫队长 / 警长：通常由社区中最高等级的武者或战士担任，可参照下表使用百分骰随机决定。</p>

<table class="class-table">
<tr><th>百分骰</th><th>出任</th></tr>
<tr><td>01-60</td><td>等级最高的武者</td></tr>
<tr><td>61-80</td><td>等级次高的战士</td></tr>
<tr><td>81-100</td><td>等级最高的战士</td></tr>
</table>

<p>请用下一节的表来决定其等级。</p>
<p>守卫 / 士兵：社区每满一百人中会有一个全职守卫或士兵。除此之外，每二十人中会有一个健壮的地方民兵或后备士兵，可在数小时之内投入工作。</p>
