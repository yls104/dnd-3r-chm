<h1 class="title">宗教</h1>
<p>没有任何力量比宗教对社会更具影响力了。你所设定的宗教必须符合社会状况，神职人员与居民间的关系如何？人民对宗教、神祇和牧师的观感又是如何？除了敬拜神祇之外，宗教组织也常提供其他服务：保存资料、典礼司仪、裁判纠纷、照顾穷人病人、守护社区、教育孩童、知识传承、维护风俗文化等。</p>
<p>有时候某个宗教的教团可能并不统一。你甚至可以依信条、方略或阵营，将信奉同一神祇的牧师划分成不同教派，相互对立。不同的修士会可能以选择不同的领域为区别。例如：若神祇的领域为善良、知识、秩序与战争，则信徒可能分为两派：一派修习战争与秩序（惩罪派），另一派则崇尚善良与知识（先知派）。</p>
