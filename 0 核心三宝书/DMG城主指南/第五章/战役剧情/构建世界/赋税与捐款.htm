<h1 class="title">赋税与捐款</h1>
<p>玩家人物可能需要将财富的五分之一纳给帝王或地方领主，作为税捐。不过随地区不同，税率也可能不一样。代议制的政府缴税期可能为一年、半年或一季。当然，冒险者与旅人可以逃避大部分缴税期，所以你大可忽略玩家人物的赋税，不过拥有土地或住宅的人通常会被课税。</p>
<p>忠实的信徒会捐款给教会，通常为冒险所得的十分之一。一般宗教捐款并非强制，但严格或激进的宗教组织有自己的稽征人员，这类宗教税需要政府支持。</p>
