<h1 class="title">政治</h1>
<p>王国权谋、城邦战争、大小政治团体间彼此尔虞我诈，这些剧情都十分有趣。你在设计战役时，至少要决定每个地区的掌权者。若各地区领主与贵族之间的政治关系复杂，你就需要思考以下内容。当然，你可以研究现实世界中的政治体制与结构作为参考（特别是历史），这些资料可以充实你的设定。但也不要害怕创新，你还是可以创造现实历史以外的事物。</p>
