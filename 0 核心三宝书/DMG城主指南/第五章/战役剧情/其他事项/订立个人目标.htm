<p>玩家们迟早会让他们的人物订立个人目标，例如：加入某个公会、创立自己的教派、建造一座要塞、开创一项事业、获得某个魔法物品、成长变强以赶走威胁故乡的敌人、寻找失散多年的兄弟或追踪以前从他们手里逃出的坏蛋，等等。个人目标并不只是玩家人物的背景，也是你设计冒险的好题材。个人目标不应轻易可以达成，但也应至少有达成的可能和机会。</p>
