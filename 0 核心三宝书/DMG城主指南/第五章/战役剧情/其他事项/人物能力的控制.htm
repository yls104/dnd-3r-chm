<h1 class="title">人物能力的控制</h1>
<p>随着战役慢慢发展，人物等级会逐步上升，还会获得宝藏、财富与名声。你必须随着他们的成长给予更强的挑战，包括加强敌人能力与提高任务难度。</p>
<p>同时，你也要密切注意玩家人物的行为，既不要让他们因为强大而失去控制，也不要让他们无法使用提供给他们的东西。虽然玩家人物的成长方向与使用新能力的方式是由玩家决定，但控制战役、保持游戏平衡（参考第一章13页）、让游戏顺利进行是你的责任。</p>
