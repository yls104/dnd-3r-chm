<h1 class="title">位面特征</h1>
<p>每个位面都有自己的特性，亦即各自的自然法则。位面特征分为几个范畴，所有位面均具有下列特征：</p>
<p><b>物理特征（Physical Traits）：</b> 物理与自然法则，包含重力与时间的运作方式。</p>
<p><b>元素或能量特征（Elemental and Energy Traits）：</b> 支配该区域最主要的元素或能量。</p>
<p><b>阵营特征（Alignment Traits）：</b> 许多位面与人物一样具有守序、混乱、善良或邪恶之分，拥有自己的道德和价值观。</p>
<p><b>魔法特征（Magic Traits）：</b> 魔法在各位面里的运作方式各异，此处会列出魔法效果的限制。</p>
