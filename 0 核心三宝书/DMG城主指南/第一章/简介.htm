<h1 class="title">简介</h1>
<p>“龙与地下城”（Dungeons &amp; Dragons D&amp;D）是一套拥有超过三十年历史，为角色扮演游戏（Roleplaying Game）立下里程碑的名作。</p>
<p>《地下城主指南》为地下城主（Dungeons Master，简称DM）提供了安排冒险、描述剧情、控制怪物与仲裁“龙与地下城”游戏所需的各种资料。本书与《玩家手册》、《怪物图鉴》共同构成了“龙与地下城”的核心规则。</p>
