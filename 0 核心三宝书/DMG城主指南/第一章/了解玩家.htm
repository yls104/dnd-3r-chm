<h1 class="title">了解玩家</h1>
<p>大多时候是由DM邀请玩家参与游戏（虽然不是永远都这样）。此时你有责任了解这些玩家，确定他们是否合得来，可以互相合作，并且喜欢你带的游戏。</p>
<p>这与游戏的风格有关，你必须知道玩家想玩到什么样的游戏。对于新加入的玩家或者刚组成的团体而言，这可能得花上一些时间。你得有自知之明，游戏虽然由你做主，但游戏也是大家的。玩家愿意一次又一次的聚在一起，是因为他们相信你可以帮助他们获得乐趣以及好的游戏经验。</p>
