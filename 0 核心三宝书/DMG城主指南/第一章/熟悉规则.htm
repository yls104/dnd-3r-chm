<h1 class="title">熟悉规则</h1>
<p>如果你知道骑着狮鹫的玩家人物在面对石像鬼攻击时，会使用到空中战斗规则，请在游戏前复习这些规则。冒险任务偶尔会用到较少使用的规则，如果你在游戏进行中复习，就会拖延游戏时间。最好在游戏前熟读可能用到的规则，包括NPC或玩家人物已准备的法术内容，以及基本的战斗规则。</p>
<p>当玩家对规则有疑问，你是提供答案的最适合人选。这也是有时DM被称为裁判的原因。</p>
<p>然而不论你对规则有多熟，某个玩家还是可能提到一些你忽略的部分。大部分玩家不会因为比你熟悉规则，就骑到你头上。如果其他人纠正你说的规则或提醒你没想到的部分，请感谢他的帮助。大家合作可以让游戏更好，所有人都将因此受益。</p>
