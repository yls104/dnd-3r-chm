<h1 class="title">人物种族或生物种类的非玩家人物修正值</h1>

<p>请将下列所有修正值（例如属性修正值）加到各职业的对应数值上。例如：半身人的敏捷属性有+2种族调整值（因此有+1敏捷加值），而且所有豁免检定有+1加值，因此总计获得+2反射检定加值。若专长重复，请再选新的。</p>

<p>你可参考《玩家手册》与《地下城主指南》，设定更详细的人物种族或生物种类特性（下列技能修正值已包含所有影响技能检定的种族特性）。</p>
