<h1 class="title">朋友</h1>

<p>不是所有人都讨厌玩家人物。如果玩家人物够聪明，他们可以在旅途中交到许多朋友。玩家人物的朋友可分为四类：盟友、部属、追随者与雇工。“领导力”专长（参见105页：玩家人物作为领导者）使人得以吸引部属与追随者。盟友、雇工与玩家人物的关系，并不同于部属与追随者。</p>
