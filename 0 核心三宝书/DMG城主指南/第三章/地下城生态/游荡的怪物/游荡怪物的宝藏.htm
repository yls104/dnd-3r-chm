<h1 class="title">游荡怪物的宝藏</h1>
<p>一般而言，游荡怪物身上不会带着巢穴中的宝藏，通常其身上的装备就是宝藏。有智力的游荡怪物有可能（50%几率）带着等级相等于地下城等级的宝藏。无智力怪物不会有宝藏。例如：凶暴鼬鼠的巢穴或许会有一些遭其杀害之生物的贵重物品，但是他不会带着那些东西四处走动。</p>
<p>因为游荡怪物的宝藏较少，人物通常会试着减少遇到游荡怪物的机会。</p>
