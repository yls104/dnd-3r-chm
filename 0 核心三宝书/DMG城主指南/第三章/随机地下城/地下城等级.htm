<h1 class="title">地下城等级</h1>
<p>有些地下城有许多层，愈底层的区域愈危险，愈接近地面愈容易。此时，最接近地面之层级的遭遇等级可能是1级（EL=1），每往下深入一层就提高一级（往下第二层是2级，第三层是3级，以此类推）。</p>
<p>地下城等级是用来评量地下城（或其他冒险区域）的危险程度。一般而言，冒险队伍应该面对等级与本身队伍等级相符的区域（大队伍可以面对较难的区域，小队伍可能需要待在较简单的区域）。</p>
