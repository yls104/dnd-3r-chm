<h1 class="title">冒险设定里的地下城</h1>
<p>“地下城”这个词可以作广义解释。一般所谓地下城通常位于地下，但是地上某些地点也可以叫做“地下城”，有些DM甚至用这个词称呼任何冒险地点。为了讨论方便，我们将地下城视为一个密闭区域，其中连接了许多不同事件遭遇。</p>
<p>最常见的地下城就是由智慧生物为了特定目的而建造的地下结构，其中包含由走道连接起来的房间、通往地表的楼梯，以及阻挡入侵者的门与陷阱。典型地下城是遭建筑者废弃，由其他生物盘踞的地方。冒险者探索这种地方，希望能找到原先居民遗留或目前居住生物拥有的宝藏。</p>
