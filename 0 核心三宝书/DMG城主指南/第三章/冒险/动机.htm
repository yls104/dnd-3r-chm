<h1 class="title">动机</h1>
<p>动机推动冒险，也就是让玩家人物牵连进你所设计剧情的推手。如果玩家人物缺乏动机，他们就不会去做你想要他们做的事，那你辛苦的心血就白费了。贪婪、恐惧、复仇、需求、道德感、愤怒或好奇等等，都是很好的动机。当然，还有乐趣，永远别忘了这点。</p>
<p>编写一份能引起玩家们强烈动机的冒险，最重要的是要先了解你和你的玩家们喜欢哪一种的游戏风格（见第7页对不同游戏风格的讨论）。</p>
