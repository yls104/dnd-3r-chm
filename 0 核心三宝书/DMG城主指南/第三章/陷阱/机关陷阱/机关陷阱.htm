<h1 class="title">机关陷阱</h1>
<p>地下城经常配有可怕的机关陷阱（即非魔法陷阱），例如：受害者不小心踩到地面触动板时，会射出隐藏的十字弓矢或造成坍陷。陷阱的特征包括位置、触发条件、易发觉的程度、可造成的伤害，以及是否可进行豁免检定。弓箭攻击、刀刃横扫或各式武器类陷阱都采用一般攻击检定，攻击加值由DM决定。</p>
<p>若“搜索”检定成功（DC=20），可在触发前发现简单的机关陷阱（如圈套、由绊索触发的陷阱或陷坑等大型陷阱）。</p>
<p>“搜索”检定成功（DC=21）的人物，可在触发前发现隐藏良好或复杂的机关陷阱。所谓复杂陷阱是指牵涉到压力板、连接到门上的装置、以重量改变、空气扰动、震动或其他不寻常方式触动的陷阱。</p>
