<h1 class="title">“搜索”及“解除装置”的DC</h1>
<p>机关陷阱的制作者可以决定“搜索”及“解除装置”的DC；魔法陷阱的难度则取决于所使用的最高等级法术。</p>
<p><strong>机关陷阱：</strong>“搜索”及“解除装置”的基本DC是20，增加或减少DC会连带影响制作陷阱的基本花费（见表3-15）及其CR（见表3-13）。</p>
<p><strong>魔法陷阱：</strong>“搜索”及“解除装置”的DC=25+所使用的最高等级法术等级。只有具有“陷阱感知”的人物才能够对魔法陷阱进行“搜索”及“解除装置”。这一类的DC高低不会影响制作陷阱的基本花费及CR。</p>
