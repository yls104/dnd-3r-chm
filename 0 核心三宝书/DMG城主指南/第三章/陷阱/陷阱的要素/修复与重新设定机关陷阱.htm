<h1 class="title">修复与重新设定机关陷阱</h1>
<p>修复机关陷阱须通过与制作机关陷阱相同DC的“手艺：制作陷阱”检定，而且需要相当于1/5陷阱市价的材料。修复所需花费的时间可参考制作陷阱的时间，但只需要计算更换材料的部分即可。</p>
<p>重新设定机关陷阱通常只需要一分钟左右，例如把活门推回原位、重新装填十字弓或是调整毒针的位置。如果该陷阱需要较复杂的方式重新设定，要适当增加重新设定的时间。</p>
