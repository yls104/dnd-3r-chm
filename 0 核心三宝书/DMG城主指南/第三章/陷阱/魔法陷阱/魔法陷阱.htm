<h1 class="title">魔法陷阱</h1>
<p>许多法术能用来制造危险的陷阱。例如：高等级牧师可施展“守卫结界”或“魔法徽记”，以防止入侵。高等级法师可施展“火焰陷阱”或“永恒幻影”来封锁区域或迷惑闯入者。除非法术或物品另有描述，否则请参考以下说明：</p>
<p class="list-item"> 游荡者（只有游荡者）通过“搜索”检定（DC=25+法术等级），可以在触发前发现魔法陷阱。其他人物无法以“搜索”检定发现魔法陷阱。</p>
<p class="list-item"> 豁免检定可以避开魔法陷阱的效果（DC=10+法术等级x1.5）。</p>
<p class="list-item"> 游荡者（只有游荡者）通过“解除装置”检定（DC=25+法术等级），可以解除魔法陷阱。</p>
