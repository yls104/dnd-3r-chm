<h1 class="title">有职业的怪物</h1>
<p>许多怪物会因增加职业等级而变强（见《怪物图鉴》）。若怪物有职业等级，在决定其宝藏之前，先为怪物配备适当的装备。你可以利用第128页的表4-23“NPC装备价值”来查出某一职业等级该拥有什么样的装备。之后再依照《怪物图鉴》的内容，以及底下“设定宝藏”一节的规则来决定怪物所拥有的宝藏。这种方式可能会让怪物拥有较多的物品，不过这并无妨（见底下“自订宝藏”一节）。</p>
