<h1 class="title">其他宝藏</h1>
<p>有时你得设定一些与怪物无关的宝藏。例如：你建造了一座没有怪物，只有致命陷阱和机关保护宝藏的迷宫。你还是可以使用标准列表掷骰产生宝藏。首先确定队伍的平均等级，然后参照第54页边栏附表中每场遭遇所得，再由该冒险总共应得的财富数中扣除这个迷宫以外的所得，就可以算出迷宫中的宝藏总值了。你可以利用表3-3随机分配迷宫中各场遭遇所得的宝藏价值，而表3-5可以协助你怎么分配各场遭遇宝藏的内容种类。</p>
