<h1 class="title">自订宝藏</h1>
<p>你可能会想要为一个难缠的怪物、阴谋的主使、佣兵头子或其他特殊的事件遭遇设计一份与众不同的宝藏。你可以利用表3-3来计算宝藏总值，然后跳过表3-5，直接决定宝藏的内容。</p>
<p>如果你这么做的话，记得在遭遇中所使用的物品，价值不要超过宝藏总值的一半。例如：对手身上的宝藏全都是消耗性的药水与卷轴，在遭遇结束后，队伍可能只能获得一些空瓶与空的卷轴筒。</p>
