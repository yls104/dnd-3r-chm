<h1 class="title">非玩家人物的宝藏</h1>
<p>NPC身上所穿戴的装备视为他拥有的宝藏。你可以从表4-23查到NPC身上携带物品的总价。你也可以依照NPC的等级和职业，在第四章的叙述中，找出他应该穿戴的装备种类。除了装备之外，NPC当然也可以拥有其他财宝。不过NPC的装备总值通常都是同等级怪物的三倍左右，打败敌方NPC可以让队伍捞一大票。当然，敌方NPC身上的装备通常都是专门对付玩家人物的魔法物品（有些甚至只能使用一次），如此才不至于破坏游戏平衡。</p>
