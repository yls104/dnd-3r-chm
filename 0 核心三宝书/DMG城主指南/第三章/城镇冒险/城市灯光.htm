<h1 class="title">城市灯光</h1>
<p>在城市大道两旁屋檐前常挂有提灯，离地约7英尺。这些路灯间距离为60英尺，所以沿路均可获得照明。次要道路或街巷不会点灯；夜间外出的居民经常得雇用提灯人引路。</p>
<p>即使在日间，街巷里也可能因为两旁高屋的阴影而显得极为幽暗。不过即使这样的街巷在日间仍不足以提供真正的隐蔽效果，但当处身其中的人物要进行“躲藏”检定时可获+2环境加值。</p>
