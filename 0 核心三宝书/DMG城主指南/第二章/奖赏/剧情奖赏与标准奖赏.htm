<h1 class="title">剧情奖赏与标准奖赏</h1>
<p>处理剧情奖赏的方式有两种。第一，你可以不给标准奖赏。也就是说，杀死怪物本身完全得不到经验值，但人物可藉此通过重重考验以完成目标，得到剧情奖赏。如果你采用这种方法，请务必注意队伍在冒险过程中所击败的怪物，以便在最后发放经验值和宝藏时能适当地反映出队伍所经历过的困难险阻。</p>
<p>另一种方法则是在击败怪物时只给一半的标准奖赏，另一半则以剧情奖赏的方式来补足。这种方法的好处是可以平衡宝藏和经验值的获得时间。</p>
<p>除非你想加快人物成长速度，否则请不要在标准奖赏的经验值外，又加上剧情奖赏（即使你给予更多的宝藏补偿也不能这样）。</p>
