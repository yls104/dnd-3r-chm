<h1 class="title">角色扮演奖赏</h1>
<p>对喜好角色扮演的玩家来说，他们往往会选择符合人物性格，但却不一定是最有利的行为。扮演得好的人能够做出适宜且具有特色的举动。例如：吟游诗人可能写出一首歌颂某段战役剧情的诗、爱说笑的术士可能会在游戏中说出令人捧腹的笑话。有些人甚至会爱上NPC，花费大量时间精力来扮演恋爱情节。这类角色扮演是值得鼓励的，因为他能提升游戏的气氛（但如果对游戏气氛无益，就不要给予奖赏）。</p>
<p>角色扮演奖赏只能靠DM判断。也就是说，不可能套用挑战级数的概念。这类奖赏的数值要适中，一般而言，每次冒险不要给予超过“人物等级x50”点的经验值奖励。</p>
