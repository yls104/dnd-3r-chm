<h1 class="title">经验值惩罚</h1>
<p>施展某些法术或是制造魔法物品时，人物可能会失去经验值。这是游戏的重要机制，可以限制和控制人物的这类行为，也可以让玩家进行有趣的抉择。一般而言，除了游戏明确设定的规则之外，你不应夺走人物的经验值。虽然奖赏可以鼓励好的行为，但惩罚却无法吓阻不好的行为，而且往往会导致争执和愤怒。如果你对某个玩家的行为看不顺眼，请以游戏外沟通的方式来解决。如果还是无法解决，就不要让他参与游戏。</p>
