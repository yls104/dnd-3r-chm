<h1 class="title">剧情奖赏</h1>
<p>冒险者们从巨魔巢穴里救出了市长的儿子。他们暂时放下手头上的任务，并将小孩送回到父母身边。他们是否应该因此而得到经验值的奖赏呢？</p>
<p>有些DM认为这个答案是肯定的。因此，你必须建立一套系统来奖励这些有明确目标，却不包含战斗的行为。</p>
<p>有时候，你也可以针对某些正常状况下没有经验值的行为进行奖赏。这种奖赏就称为“剧情奖赏”，但这种奖赏只适合经验丰富的DM来运用。</p>
