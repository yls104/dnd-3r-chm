<h1 class="title">规则变化：定额经验值</h1>

<p>如果你想避免复杂的计算，也可选择在每场难度适中的遭遇过后，直接给予每位冒险者“平均队伍等级x75”点的经验值。稍难的遭遇可以将平均队伍等级乘上100或是150，轻松一点的遭遇则是平均队伍等级乘上25或是50。另一种计算方式是，在每一小段冒险历程之后，给予“平均队伍等级x300”点经验值，并视难易程度稍加调整。</p>

<p>这种方式可以精准地控制人物的升级速度，但缺点则是把玩家的奖励一般化了，而不是根据他们完成的特殊功绩而给予奖励。玩家有可能对这种一成不变的奖赏感到不满意。</p>
