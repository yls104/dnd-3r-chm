<h1 class="title">陷阱的挑战级数</h1>
<p>陷阱的形式很多。本书提到的陷阱（请见69页至74页）都会列出挑战级数。如果要自创陷阱，其挑战级数与可能造成的伤害应成正比，每2d6点伤害，挑战级数便+1。如果是魔法陷阱，挑战级数须从1开始，每2d6点伤害或是每等级的法术效应，挑战级数再+1。一般而言，陷阱的挑战级数不应超过10。</p>
<p>通过陷阱的方法包括：解除、避开或是触发后存活。如果人物根本没有察觉到陷阱，就不算遭遇该陷阱（当然也就没有经验值奖赏）。</p>
