<h1 class="title">移动与位置</h1>
<p>没几个人物能在战斗中保持太长时间不动。敌人出现并冲向队伍；冒险者则做出回应，在战胜第一个对手之后又向下一个目标前进；法师环绕着战场跑位，寻找施展魔法的最佳位置；游荡者悄无声息的掠过喧嚣的战场，找出落单或是没有防备的目标并施以致命的偷袭。在进行所有这些战术操作的时候，设法用一个确定的尺度来标明人物的位置，对游戏的进行可以有极大的帮助。</p>
<p>你可以在方格纸上用一些小模型来处理人物的移动和位置。小模型能显示人物之间的相对位置，方格纸则可以清楚地标明人物与怪物能移动多长的距离。</p>
