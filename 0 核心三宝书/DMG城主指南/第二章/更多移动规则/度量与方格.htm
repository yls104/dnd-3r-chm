<h1 class="title">度量与方格</h1>
<p>战术地图的标准单位为5英尺方格。这样的单位既便于摆放小模型，也便于绘制地下城的地图，这种地图通常都是在方格纸上进行制作。</p>
<p>在战斗中，每个小型或是中型的人物都占据一个单独的5英尺方格。体型更大的生物会占据更多的方格，而数个体型较小的生物则可以挤在同一个方格里。请见《玩家手册》150页，表8-4。</p>
