<h1 class="title">三维空间的移动</h1>
<p>不是每种生物的移动方式都是走路或是奔跑。比如鲨鱼，即使只能通过游泳来进行移动，但却可以用一个奔跑动作来游得更快；受“飞行术”影响的人物能以飞行方式进行冲刺；而攀爬中的游荡者则可以用自己的一部分移动速度先爬下墙，然后再利用本轮内剩余的速度冲向敌人。移动的规则可以被应用到任何一种移动方式上，而不单只用于处理平地移动。</p>
