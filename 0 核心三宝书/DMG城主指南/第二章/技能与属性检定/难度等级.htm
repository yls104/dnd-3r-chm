<h1 class="title">难度等级</h1>

<p>决定DC是你的工作，不过相关的规则通常都很直接。对抗法术时的豁免检定，其DC有标准规则可供参考。迫使其他人进行豁免检定的生物或是魔法物品，其说明中必有DC的计算方法，如果其作用类似法术，则计算方法与法术相同。一般的规则如下：</p>

<p><strong>法术：</strong>10+法术等级+施法者的关键属性调整值。</p>

<p><strong>怪物能力：</strong>10+怪物生命骰的一半+怪物的关键属性调整值。</p>

<p><strong>其他：</strong>10至20，默认可用15。</p>

<p>与属性或是技能检定相同，DC和豁免检定都可以进行调整，请见本章30页“地下城主的好伙伴”之相关说明。</p>
