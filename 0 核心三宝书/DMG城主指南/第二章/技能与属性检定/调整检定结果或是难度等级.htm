<h1 class="title">调整检定结果或是难度等级</h1>
<p>根据所处环境的不同，人物的检定结果会有所调整，难度等级也可能随之调整。</p>
<p class="list-item"> 人物处于可增进表现的环境中时，会使人物在检定时获得加值。例如：拥有非常好用的工具、获得其他人物的帮助或是刚好拥有特别精确的信息等。</p>
<p class="list-item"> 人物处于妨碍表现的环境中时，会使人物在检定时受到减值。例如：被迫使用临时找到的不称手的工具、得到误导性的信息等。</p>
<p class="list-item"> 使工作更容易完成的外在环境，能降低DC。例如：友好的观众氛围或是助益性的环境条件等。</p>
<p class="list-item"> 使工作更加困难的外在环境，会提升DC。例如：观众怀有敌意或是必须完美无缺地完成工作等。</p>
