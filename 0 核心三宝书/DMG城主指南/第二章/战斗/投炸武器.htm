<h1 class="title">投炸武器</h1>
<p>投炸武器为远程武器，遭受撞击即碎裂，并把内容物泼溅到目标以及邻近的生物或是物体上。该武器的内容物大多为液体，例如强酸或是圣水。容器本身则为易碎物，例如玻璃扁瓶。使用投炸武器属于远程接触攻击。请见《玩家手册》160页。</p>
<p>关于各种投炸武器的具体信息，请见《玩家手册》127页与129页。</p>
