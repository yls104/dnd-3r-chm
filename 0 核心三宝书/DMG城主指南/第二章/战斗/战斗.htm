<h1 class="title">战斗</h1>
<p>勇敢的冒险者撞破木门，却遭到手持生锈兵刃和长矛的嗜血大地精的埋伏。</p>
<p>一队骑士三人组骑着他们华丽的坐骑冲过树林，将长枪刺入盘踞在小河沿岸的恐怖多头蛇那布满鳞甲的身躯。</p>
<p>巨龙腾空而起，追赶精灵领主和他的随从们，龙颚在他们惊恐逃窜的背影后不断发出巨大的咬合声。</p>
<p>战斗是让“龙与地下城”游戏变得刺激有趣的重要因素。鲜有比一场激战更能试炼人物勇气的方式。作为DM，最重要的工作就是处理战斗，确保战场上每件事都能迅速流畅地进行，并判定每轮动作的结果。</p>
