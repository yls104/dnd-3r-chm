<h1 class="title">突袭轮</h1>
<p>当只有其中一方察觉到另一方时，DM要把战斗的第一轮视为突袭轮来处理。在该轮中每个人物只能进行一个标准动作。而且只有察觉到另一方的人物才能做出动作。这条规则所反映的是，即使一个战斗人物有所准备，也还是得花些时间来进入状况，因此一开始只能进行标准动作。</p>
<p>本规则使得先攻权检定对战斗的影响被削弱了，因为先攻权对第一轮的意义最大。采用突袭轮规则时，就算一名战士抢在敌人之前做出行动，他最多也只能在对方反应前进行一次攻击。</p>
