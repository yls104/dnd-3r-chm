<h1 class="title">挤过</h1>
<p>生物可以挤过其占用空间一半宽度的地方。该状态下，生物只能以正常速度的一半移动。攻击检定有-4减值，AC有-4减值。同时，由于该生物已经塞满该处，其他更小的生物就无法同时再占据此处。</p>
<p>生物可以挤过其身高一半高度的地方。减值和上述相同（宽度和高度造成的减值可累计）。生物也可以挤过其身高四分之一高度的地方，但必须以倒下或是匍匐的状态。倒下状态的一般减值与各种限制均适用此状况。</p>
