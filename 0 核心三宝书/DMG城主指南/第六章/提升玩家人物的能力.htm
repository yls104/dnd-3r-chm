<h1 class="title">提升玩家人物的能力</h1>
<p>《玩家手册》的规则是假设人物都有方式可以获得所有升级所须的条件。他们可以在图书馆研读新法术，找到导师以及练习新技能与专长的地方。一般而言，标准规则不考虑人物究竟如何进行研究与训练，而是当作背景带过。然而，你是设计背景的人，你可以决定要怎么处理这类事件。切记！若非必要，最好不要太追究琐事。</p>
