html,body{font-family:Arial,Helvetica,sans-serif;}
body{margin:20px;background:#f8f4e6;color:#000;font-family:"SimSun","Microsoft YaHei",sans-serif;}
.page{width:980px;margin:auto;}
h1.title{font-size:28px;font-weight:bold;color:#A44797;border-bottom:2px solid #A44797;padding:0 0 8px 0;margin-bottom:20px;display:block;}
p{text-indent:2em;line-height:1.8;margin:10px 0;}

/* 优化表格样式 - 更易阅读 */
table.class-table{width:100%;border-collapse:collapse;border:2px solid #b9a56b;margin:15px 0;background:#faf7eb;}
table.class-table th{background:#d9c78a;border:1px solid #b9a56b;padding:12px 15px;font-weight:bold;text-align:center;font-size:15px;color:#2c1e0f;}
table.class-table td{border:1px solid #b9a56b;padding:10px 15px;vertical-align:middle;font-size:14px;line-height:1.6;text-align:center;}
/* 第一列（标签列）强制左对齐，方便对照阅读 */

/* 交替行底色，强化视觉分层 */

<style id="codex-layout-final">

    width: 100% !important;

<div class="page">
<h1 class="title">获得固定生命值</h1>
<p>你可改变规则，人物升级时不用掷骰，而改为用生命骰的平均值作为增加的生命值（参见下表），体质调整值依然适用。一般而言，掷出过低的生命值会严重影响角色存活率，而掷出过高的生命值却不见得有多大的益处。因此，采用固定生命值会比随机生命值的人物略强。</p>

<table class="class-table">
<tr>
    <th></th>
    <th>术士<br>法师</th>
    <th>吟游诗人<br>游荡者</th>
    <th>牧师<br>德鲁伊<br>武僧</th>
    <th>战士<br>圣武士<br>巡林客</th>
    <th>野蛮人</th>
</tr>
<tr>
    <td>生命骰</td>
    <td>d4</td>
    <td>d6</td>
    <td>d8</td>
    <td>d10</td>
    <td>d12</td>
</tr>
<tr>
    <td>偶数等级增加的生命值<br>（2级、4级等）</td>
    <td>2</td>
    <td>3</td>
    <td>4</td>
    <td>5</td>
    <td>6</td>
</tr>
<tr>
    <td>奇数等级增加的生命值<br>（3级、5级等）</td>
    <td>3</td>
    <td>4</td>
    <td>5</td>
    <td>6</td>
    <td>7</td>
</tr>
</table>
</div>
</body>
