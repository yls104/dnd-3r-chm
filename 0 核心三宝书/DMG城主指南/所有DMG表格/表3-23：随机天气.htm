    <title>表3-23：随机天气</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:"Microsoft YaHei","微软雅黑",sans-serif;background:#f9f9f9;padding:30px 20px;line-height:1.8}
        .container{max-width:960px;margin:0 auto;background:#fff;border-radius:6px;border:1px solid #d0d0d0;padding:28px 24px 32px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}

        table{width:100%;border-collapse:collapse;font-size:18px;font-family:"Microsoft YaHei","微软雅黑",sans-serif}
        th{background:#3a3a3a;color:#fff;font-weight:700;padding:10px 12px;text-align:center;border:1px solid #3a3a3a;font-size:18px}
        td{padding:8px 12px;border:1px solid #e0e0e0;vertical-align:middle;text-align:center;font-size:18px}
        tr:nth-child(odd){background:#fff}
        tr:nth-child(even){background:#f2f2f2}
        .state{text-align:left;font-weight:600;color:#1a1a1a;padding-left:14px}
        .sub{text-align:left;padding-left:30px;color:#1a1a1a}
        .note-ref{vertical-align:super;font-size:14px;color:#7a5a3a}
        .notes{margin-top:16px;padding-top:12px;border-top:1px solid #d0d0d0;font-size:18px;color:#444;font-family:"Microsoft YaHei","微软雅黑",sans-serif}
        .notes p{margin-bottom:4px;text-align:left}
        @media print{body{background:#fff;padding:10px}.container{border:1px solid #aaa}tr:nth-child(even){background:#f0f0f0!important}}

    </style>

<style id="codex-layout-final">

    width: 100% !important;

<body>
<div class="container">
    <div class="title">表3-23：随机天气</div>
    <table>
        <thead>
            <tr>
                <th style="width:12%">百分骰</th>
                <th style="width:16%">天气</th>
                <th style="width:24%">寒带气候</th>
                <th style="width:24%">温带气候<span class="note-ref">（注一）</span></th>
                <th style="width:24%">沙漠</th>
            </tr>
        </thead>
        <tbody>
            <tr><td>01–70</td><td class="state">正常天气</td><td>寒冷，平静</td><td>依季节正常变化<span class="note-ref">（注二）</span></td><td>炎热，平静</td></tr>
            <tr><td>71–80</td><td class="state">异常天气</td><td>热浪（01–30）或骤寒（31–100）</td><td>热浪（01–50）或骤寒（51–100）</td><td>炎热，刮风</td></tr>
            <tr><td>81–90</td><td class="state">恶劣天气</td><td>降水（雪）</td><td>降水（形态视季节而定）</td><td>炎热，刮风</td></tr>
            <tr><td>91–99</td><td class="state">风暴</td><td>冰雪暴</td><td>雷暴，冰雪暴</td><td>沙尘暴</td></tr>
            <tr><td>100</td><td class="state">强烈风暴</td><td>风雪暴</td><td>暴风，风雪暴，飓风，龙卷风</td><td>豪雨</td></tr>
        </tbody>
    </table>
    <div class="notes">
        <p><span style="font-weight:600;">（注一）</span>包括森林、丘陵、沼泽、山脉、平原及温带水域。</p>
        <p><span style="font-weight:600;">（注二）</span>冬寒夏热，春秋温和。沼泽地区冬天会稍微温暖些。</p>
    </div>
</div>
