    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:"Microsoft YaHei","微软雅黑",sans-serif;background:#f9f9f9;padding:30px 20px;line-height:1.8}
        .container{max-width:850px;margin:0 auto;background:#fff;border-radius:6px;border:1px solid #d0d0d0;padding:28px 24px 32px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}

        th{background:#3a3a3a;color:#fff;font-weight:700;padding:10px 14px;text-align:left;border:1px solid #3a3a3a;font-size:18px}
        td{padding:8px 14px;border:1px solid #e0e0e0;vertical-align:middle;font-size:18px}
        tr:nth-child(odd){background:#fff}
        tr:nth-child(even){background:#f2f2f2}
        .dice{font-weight:600;white-space:nowrap;color:#1a1a1a;width:18%}
        .desc{color:#1a1a1a}

<div class="container">
