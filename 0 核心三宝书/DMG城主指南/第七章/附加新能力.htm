<div class="page">
<h1 class="title">附加新能力</h1>
<p>魔法物品可以任意附加新的能力。计算附加新能力的成本时，将附加前的物品视为非魔法物品。例如：如果要把“+1长剑”改造成“+2斩首长剑”，所须成本就是“+2斩首长剑”的成本减去“+1长剑”的成本。</p>
<p>如果该物品可穿戴在人物的特定部位（参见213页有关穿戴魔法物品限制的说明），则附加新能力的成本再增加一半。例如：如果要为“+2防护戒指”附加“隐形”能力，则成本等于制造“隐形戒指”的成本x1.5。</p>
