<h1 class="title">悲啸钻石 (The Moaning Diamond)</h1>
<p>这是一颗拳头大小、未经琢磨的钻石。不论何时都会发出一种痛苦悲苦的哭声。虽然如此，此钻石并不邪恶（只是诞生于痛苦中）。持用者每天可以使用钻石上的特殊能力3次。使用能力时，持用者可以使至多5,000立方英尺的泥土或石头改变形状，效果如同“塑石术”。悲啸钻石还可以召唤生命点数全满的土元素长老，誓死保护持用者。一次最多只能召唤一个元素生物，如果该生物死亡，24小时后才能再召唤下一个。传说中，悲啸钻石可以建造高楼、开凿洞穴或把城堡夷为平地。</p>
