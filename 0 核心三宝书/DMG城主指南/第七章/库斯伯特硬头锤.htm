<h1 class="title">库斯伯特硬头锤 (The Mace of Cuthbert)</h1>
<p>传说中，圣库斯伯特曾经以凡人形象行走世间，手持强大武器惩罚所有异教徒和恶人。今日这件神器虽然看起来平凡无奇，但在简朴外表下却隐藏了强大力量。此硬头锤有+5增强加值和“神圣”、“守序”和“瓦解”能力。持用者随时都可以从锤上施放“灼热光辉”（施法者等级20）。</p>
