<body><div class="container"><h1>天然武器</h1><p>天生武器是生物身上所不可分割的一部分。以天生武器进行近战攻击时视同具有武装，不会引发借机攻击。天然武器可对可触及距离内的区域造成威胁。使用天然武器通常不受次数限制，具体次数由生物固有的攻击模式决定。一般来说，生物可进行一次啮咬、一次抵撞、一次螫刺或一次挥击。生物也可使用如爪抓、触手或蹄等次要武器，但会受到攻击减值。</p></div></body></html></body>
