<body><div class="container"><h1>种族生命骰</h1><p>来自生物本身，而非来自职业等级的生命骰。例如：本书中介绍的夺心魔术士总共生命骰为17，其中9个生命骰来自术士职业等级9级，因此，种族生命骰为8（也就是没有任何职业的夺心魔生命骰）。</p></div></body></html></body>
