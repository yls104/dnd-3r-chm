<body><div class="container"><h1>爱拉亚种</h1><p>爱拉亚种属于天界生物的一支，是善良的外界生物，原生于奥林匹斯仙界。</p><p><span class="highlight">特性：</span>爱拉亚种具有下列特性（叙述中特别注明者例外）。</p><div class="list-item"><span class="highlight">— 黑暗视觉</span>，范围60英尺。昏暗视觉。</div><div class="list-item"><span class="highlight">— 对电击和石化免疫</span>。</div><div class="list-item"><span class="highlight">— 寒冷抗力10</span>，<span class="highlight">火焰抗力10</span>。</div><div class="list-item"><span class="highlight">— 巧言（超自然）：</span>爱拉神族可以和任何有语言的生物交谈，视同施展法术“巧言术”，施法者等级与爱拉神族的HD同。效果永久有效。</div></div></body></html></body>
