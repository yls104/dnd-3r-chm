<body><div class="container"><h1>吸能</h1><p>具有此能力的生物，若以近战或远程攻击命中活物时，会吸取敌人的生命力。吸能攻击命中时，会使对方承受至少1个负向等级（数量请见个别生物叙述）。若造成重击，负向等级加倍。除非特别注明，否则每使对手受到1个负向等级，便获得5点暂时生命值（重击时为10点），持续时间1小时。</p></div></body></html></body>
