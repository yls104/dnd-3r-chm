<body><div class="container"><h1>属性吸取</h1><p>近战攻击命中时，若生物具有此能力，会永久吸取活物敌人的属性值。个别生物的叙述中会说明属性伤害的项目及点数，若造成重击，则伤害加倍（如果伤害值需要掷骰，则掷骰两次，将结果相加）。除非特别注明，否则一旦属性吸取成功，无论点数多寡，生物可以获得5点暂时生命点数（重击为10点），持续时间1小时。</p></div></body></html></body>
