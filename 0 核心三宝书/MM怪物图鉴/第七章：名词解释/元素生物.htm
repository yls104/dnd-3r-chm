<body><div class="container"><h1>元素生物</h1><p>元素生物由风、土、水、火四大基本元素之一所构成。</p><p><span class="highlight">特征：</span>元素生物具有下列特征。</p><div class="list-item"><span class="highlight">— 生命骰 d8</span>。</div><div class="list-item"><span class="highlight">— 基本攻击加值</span>等于生命骰的四分之三（同牧师）。</div><div class="list-item"><span class="highlight">— 豁免检定视元素种类而不同。</span>上，水元素强韧检定较佳，风、火元素反射检定较佳。</div><div class="list-item"><span class="highlight">— 每增加一个生命骰</span>可获得的技能点数=2+智力调整值，最少1点。第一个生命骰可获得四倍技能点数。</div><div class="list-item"><span class="highlight">— 特性：</span>元素生物具有下列特性（叙述中特别注明者例外）。</div><div style="padding-left:3.5em;line-height:1.8;margin:6px 0;"><span class="highlight">— 黑暗视觉</span>，范围60英尺。<br><span class="highlight">— 对毒素、睡眠、麻痹、震慑效果免疫</span>。<br><span class="highlight">— 不会受到重击和夹击</span>。</div></div></body></html></body>
