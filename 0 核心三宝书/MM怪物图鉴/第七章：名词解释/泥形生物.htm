<body><div class="container"><h1>泥形生物</h1><p>泥形生物没有固定形状或是形状很容易改变，通常没有心智。</p><p><span style="color:#A44797;font-weight:bold;">特征：</span>泥形生物具有下列特征：</p><p style="text-indent:0;margin-left:2em;line-height:1.8;">— <span style="color:#A44797;font-weight:bold;">生命骰 d10</span>。<br>— <span style="color:#A44797;font-weight:bold;">基本攻击加值</span>等于生命骰的四分之三（同牧师）。<br>— <span style="color:#A44797;font-weight:bold;">没有较佳的豁免检定项目</span>。<br>— 没有心智，对影响心灵的效果免疫。<br>— 具有<span style="color:#A44797;font-weight:bold;">目盲</span>（但有“盲感”特殊能力）。<br>— 对<span style="color:#A44797;font-weight:bold;">毒素、睡眠、麻痹、变形、震慑效果免疫</span>。<br>— 泥形生物<span style="color:#A44797;font-weight:bold;">不需要进食、睡眠以及呼吸</span>。</p></div></body></html></body>
