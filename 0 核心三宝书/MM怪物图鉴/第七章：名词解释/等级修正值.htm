<body><div class="container"><h1>等级修正值</h1><p>有些怪物可以当作玩家人物，提供新鲜有趣的选择。此栏会列出等级修正值。此值再加上生命骰就是怪物的有效人物等级。某些生物除了具有法术抗力，其属性加值和类法术能力，也都算入等级修正值中。如果生物因种族特性扣除“部分”等级，则此数值也会加在此栏。若人物能以此怪物作为伙伴，则也要用“等级调整”计算其ECL。</p></div></body></html></body>
