<body><div class="container"><h1>威势</h1><p>具有此特殊能力的生物外观非常令人畏惧，在进行某些有威胁性的行动时，如：冲刺、攻击或咆哮等，此能力会自动生效。范围内所有目睹该动作的生物都会陷入惊惧或震栗。威势会影响生命骰或等级低于攻击者生物的生命骰（DC10+攻击者种族生命骰的一半+攻击者魅力调整值）。成功通过意志检定可以免疫此效果24小时。威势属于影响心灵的恐惧效果。</p></div></body></html></body>
