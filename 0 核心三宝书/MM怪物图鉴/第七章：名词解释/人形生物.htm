<body><div class="container"><h1>人形生物</h1><p>人形生物通常有两只手、两条腿、一颗头、躯干和头骨的外型与人类相同。人形生物很少具有超自然或特异能力，但大多可以说语，也有发达的社会组织，体型多半属于中型或小型。人形生物可以再细分为亚种（如：精灵、类地精或爬行人形生物）。</p></div></body></html></body>
