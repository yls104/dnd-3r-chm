<body><div class="container"><h1>再生</h1><p>具有再生能力的生物很难被杀死。再生生物所受的伤视为非致命伤害，每轮会以一定速率自动治疗。某些特定的攻击形式（通常是火焰与强酸）可以对再生生物造成致死伤害，不能以再生能力治愈。一旦再生生物累积过多非致死伤害而陷入昏迷，就可以用“重击”杀死该生物，但最后一击必须要是能对该生物造成致死伤害的形式。攻击效果若不是伤害生命值，便无视再生能力。再生能力不能恢复因饥饿、干渴或窒息造成的生命值伤害。再生生物能够重新长出或接合被截断的肢体。无体质值的生物不会具有再生能力。</p></div></body></html></body>
