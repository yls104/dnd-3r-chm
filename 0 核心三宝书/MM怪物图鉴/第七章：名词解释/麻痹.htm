<body><div class="container"><h1>麻痹</h1><p>这种特殊攻击可以让受害者动弹不得，不能移动、说话或进行任何肢体动作。受害者只能呆在原地静止不动，陷入无助状态。麻痹效果作用于肉体，受害者通常可以进行强韧检定（DC见个别生物叙述），通过则无效。与“人类定身术”或其他类似效果不同，遭麻痹之后不能每轮重新进行豁免检定。飞行中的有翼生物若遭麻痹，会因无法鼓翅而坠落。游泳中的生物遭麻痹可能会溺水。</p></div></body></html></body>
