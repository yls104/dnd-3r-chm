<body><div class="container"><h1>毒素</h1><p>遭到毒素攻击时，受害者必须通过强韧检定，否则会中毒，受到初始伤害。初始伤害可能是属性伤害。除非特别注明，否则无论初始检定成功与否，受害者在1分钟后还要再进行一次豁免检定，失败则会受到后续伤害。细节请见个别生物的说明。具有毒素攻击的生物对本身以及同类的毒素免疫。对抗毒素的强韧豁免检定的DC=10+攻击者生命骰的一半+攻击者体质调整值。</p></div></body></html></body>
