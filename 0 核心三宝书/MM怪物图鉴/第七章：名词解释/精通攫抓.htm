<body><div class="container"><h1>精通攫抓</h1><p>具有此能力的生物若以近战武器（通常是爪抓或啮咬）击中对手，除去造成正常伤害之外，还可以同时进行擒抱（啮咬）动作，此属于即时动作，也不会引发借机攻击。部分生物甚至可以进行擒抱触手攻击。精通攫抓只能作用在体型至少小一级的敌人身上。若选择后者，在后续的擒抱检定上会受到-20减值，但不会陷入擒抱状态，同时保有AC上的敏捷加值，也可以回避危险，或用别的攻击方式对付其他敌人。若生物还具有“紧勒”能力，则会在成功擒抱造成伤害时，同时触发紧勒。</p></div></body></html></body>
