<body><div class="container"><h1>龙类生物</h1><p>龙类生物属于爬虫类生物，通常有翼，还有魔法或特殊能力。</p><p><span class="highlight">特征：</span>龙类生物具有下列特征。</p><div class="list-item"><span class="highlight">— 生命骰 d12</span>。</div><div class="list-item"><span class="highlight">— 基本攻击加值</span>等于生命骰（同战士）。</div><div class="list-item"><span class="highlight">— 强韧、反射和意志检定较佳</span>。</div><div class="list-item"><span class="highlight">— 每增加一个生命骰</span>可获得的技能点数=6+智力调整值，最少1点。第一个生命骰可获得四倍技能点数。</div><div class="list-item"><span class="highlight">— 特性：</span>龙类生物具有下列特性（叙述中特别注明者例外）。</div><div style="padding-left:3.5em;line-height:1.8;margin:6px 0;"><span class="highlight">— 黑暗视觉</span>，范围60英尺。昏暗视觉。</div><div class="list-item"><span class="highlight">— 对魔法睡眠</span>和<span class="highlight">麻痹免疫</span>。</div></div></body></html></body>
