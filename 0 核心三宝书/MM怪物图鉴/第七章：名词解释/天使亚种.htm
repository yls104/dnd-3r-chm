<body><div class="container"><h1>天使亚种</h1><p>天使亚种属于天界生物的一支，是善良的外界生物，原生于善良阵营的外层界，在D&D的宇宙中，包括天界七山、双生乐园界、奥林匹斯仙界、极乐至福界和旷野兽原界。</p><p><span class="highlight">特性：</span>天使亚种具有下列特性（叙述中特别注明者例外）。</p><div class="list-item"><span class="highlight">— 黑暗视觉</span>，范围60英尺。昏暗视觉。</div><div class="list-item"><span class="highlight">— 对强酸</span>、<span class="highlight">寒冷</span>和<span class="highlight">石化免疫</span>。</div><div class="list-item"><span class="highlight">— 电击抗力10</span>，<span class="highlight">火焰抗力10</span>。</div><div class="list-item"><span class="highlight">— 对毒素的豁免检定</span>获得+4种族加值。</div></div></body></html></body>
