<body><div class="container"><h1>盖丁亚种</h1><p>盖丁亚种属于天界生物的一支，是善良的外界生物，原生于极乐至福界。</p><p><span style="color:#A44797;font-weight:bold;">特性：</span>盖丁亚种具有下列特性：</p><p style="text-indent:0;margin-left:2em;line-height:1.8;">— <span style="color:#A44797;font-weight:bold;">黑暗视觉</span>，范围60英尺。昏暗视觉。<br>— <span style="color:#A44797;font-weight:bold;">对电击和石化免疫</span>。<br>— <span style="color:#A44797;font-weight:bold;">寒冷抗力10</span>，<span style="color:#A44797;font-weight:bold;">音波抗力10</span>。<br>— <span style="color:#A44797;font-weight:bold;">圣疗（超自然）：</span>与圣武士职业特性相同，但每日可治疗的生命点数等于正常生命值上限。<br>— <span style="color:#A44797;font-weight:bold;">对毒素的豁免检定</span>获得+4种族加值。</p></div></body></html></body>
