<body><div class="container"><h1>魔法兽类</h1><p>魔法兽与动物相似，但智力值可以超过2，通常具有超自然或特异能力，但有些只是外型奇特或生活习惯与众不同的动物。</p><p><span style="color:#A44797;font-weight:bold;">特征：</span>魔法兽具有下列特征。</p><p style="text-indent:0;margin-left:2em;line-height:1.8;">— <span style="color:#A44797;font-weight:bold;">生命骰 d10</span>。<br>— <span style="color:#A44797;font-weight:bold;">基本攻击加值</span>等于生命骰（同战士）。<br>— <span style="color:#A44797;font-weight:bold;">强韧与反射检定较佳</span>。<br>— <span style="color:#A44797;font-weight:bold;">每增加一个生命骰</span>可获得的技能点数=2+智力调整值，最少1点。第一个生命骰可获得四倍技能点数。<br>— <span style="color:#A44797;font-weight:bold;">专长：</span>具有下列特性：<br>&nbsp;&nbsp;&nbsp;<span style="color:#A44797;font-weight:bold;">— 黑暗视觉</span>，范围60英尺。昏暗视觉。<br>&nbsp;&nbsp;&nbsp;<span style="color:#A44797;font-weight:bold;">— 只擅长天生武器</span>。<br>&nbsp;&nbsp;&nbsp;<span style="color:#A44797;font-weight:bold;">— 不擅长任何防具</span>。<br>&nbsp;&nbsp;&nbsp;<span style="color:#A44797;font-weight:bold;">— 魔法兽</span>需要进食、睡眠以及呼吸。</p></div></body></html></body>
