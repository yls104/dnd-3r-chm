<body><div class="container"><h1>有效人物等级</h1><p>以《玩家手册》中的人物为基准，此数值代表怪物的强度相当于多少等级。有效人物等级10的怪物相当于10级人物。生物的有效人物等级=生命骰（包含职业等级）+等级修正值。举例来说，牛头人的生命骰为6，等级修正值+2，因此相当于8级人物。</p></div></body></html></body>
