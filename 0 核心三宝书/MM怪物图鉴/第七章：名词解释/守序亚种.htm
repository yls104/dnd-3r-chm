<body><div class="container"><h1>守序亚种</h1><p>原生于守序阵营外层界的异界生物通常属于守序亚种。此生物大多具有守序阵营。即使后天阵营改变，还是属于守序亚种。遭到针对特定阵营倾向的效果攻击时，守序亚种生物一律视为守序阵营。如果本身阵营不同，还会受到本身阵营的影响。其攻击属于守序阵营，可以克服特定伤害减免。</p></div></body></html></body>
