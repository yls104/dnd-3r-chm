<h1>多头寒蛇蜥 (Cryohydra)</h1>
<small>超大型魔法兽 (寒冷)</small>
</div>
<div class="desc">
<p>这种紫色的多头蛇蜥可以喷吐出长20英尺、高10英尺、宽10英尺的寒冰。每个头每1d4轮可喷一次，每次可造成3d6点寒冷伤害。通过反射检定可使伤害减半，其DC=10+多头寒蛇蜥的一半头数+多头寒蛇蜥的体质调整值。</p>
<p>对多头寒蛇蜥的残干予以寒冷伤害并不能阻止其头部再生 (因多头寒蛇蜥对寒冷免疫)，但5点以上的火焰伤害则可达成目的。</p>
