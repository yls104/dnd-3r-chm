<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="gb2312">
<title>死后之事 (After Death)</title>
<style>
:root{--p:#5D3A1A;--s:#C4A882;--t:#F5F0E8;--d:#2C1810;--a:#6B8E23;--r:#B22222}
*{margin:0;box-sizing:border-box}
body{background:var(--t);font:14px/1.7 "Microsoft YaHei","SimSun",serif;color:var(--d);padding:15px}
.w{max-width:900px;margin:auto;background:#fff;border:1px solid var(--s);padding:20px}
.h{border-bottom:2px solid var(--p);padding-bottom:10px;margin-bottom:12px}
.h h1{font-size:24px;color:var(--p);margin-bottom:4px}
.h small{color:#888;font-size:12px}
.desc p{margin:8px 0;text-indent:2em;font-size:13px}
.sec{font-size:16px;color:var(--p);font-weight:bold;margin:18px 0 8px;border-bottom:1px solid var(--s);padding-bottom:4px}
.ab{background:#faf8f3;border-left:4px solid var(--s);padding:10px 14px;margin:10px 0;font-size:13px}
.ab p{margin:6px 0;text-indent:0}
.ab b{color:var(--r)}
</style>
</head>
<body>
<div class="w">
<div class="h"><h1>死后之事 (After Death)</h1></div>
<div class="desc"><p>对很多D&amp;D角色而言，死后只是一个暂时的目的地。同伴们往往可以在几分钟内用"死者复活"或者"复生术"来让你的人物从死亡中重获生命，呼吸，与冒险。但是，有时候角色会一直保持死亡相当长一段时间。有时甚至跟本无法回归，永远的离开了冒险的国度。</p></div>
</div>
</body>
</html>
